<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notes App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- Header -->
        <header class="header">
            <div>
                <p class="subtitle">MY NOTES</p>
                <h1>Notes App</h1>
                <p class="description">
                    Create and organize your thoughts.
                </p>
            </div>
        </header>


        <!-- Note Form -->
        <section class="note-form-section">

            <h2 id="formHeading">Create a New Note</h2>

            <form id="noteForm">

                <div class="form-group">

                    <label for="noteTitle">
                        Title
                    </label>

                    <input
                        type="text"
                        id="noteTitle"
                        placeholder="Enter note title..."
                    >

                    <small
                        id="titleError"
                        class="error-message"
                    ></small>

                </div>


                <div class="form-group">

                    <label for="noteContent">
                        Content
                    </label>

                    <textarea
                        id="noteContent"
                        rows="5"
                        placeholder="Write your note..."
                    ></textarea>

                    <small
                        id="contentError"
                        class="error-message"
                    ></small>

                </div>


                <div class="form-buttons">

                    <button
                        type="submit"
                        id="saveButton"
                    >
                        Add Note
                    </button>

                    <button
                        type="button"
                        id="cancelButton"
                        class="cancel-btn hidden"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </section>


        <!-- Search -->
        <section class="search-section">

            <input
                type="search"
                id="searchInput"
                placeholder="Search notes..."
            >

        </section>


        <!-- Notes -->
        <section class="notes-section">

            <div class="notes-header">
                <h2>Your Notes</h2>

                <span id="notesCount">
                    0 notes
                </span>
            </div>


            <div
                id="notesContainer"
                class="notes-container"
            ></div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
