[desktop]
followUpQueueMode = "steer"

[marketplaces.openai-primary-runtime]
source_type = "local"
source = '\\?\C:\Users\admin\.cache\codex-runtimes\codex-primary-runtime\plugins\openai-primary-runtime'

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[tui]
screen_reader_detection_done = true

[tui.model_availability_nux]
"gpt-6.1-sol" = 3

[projects.'d:\semester 6\software_reengineering']
trust_level = "trusted"

[projects.'d:\semester 6\software_reengineering\notes-app']
trust_level = "trusted"

[windows]
sandbox = "elevated"

[mcp_servers.rea]
command = "cmd.exe"
args = [ "/d", "/c", "npx", "-y", "rea-agents@6.8.0", "mcp" ]
startup_timeout_sec = 30
tool_timeout_sec = 450
